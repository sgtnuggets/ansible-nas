---
- name: Create llm Configuration Directory
  ansible.builtin.file:
    path: "{{ llm_config_directory }}"
    state: directory

- name: Deploy Stinker LLMs
  ansible.builtin.command:
    cmd: "docker model run {{ item.image_name }} --backend llama.cpp"
  loop: "{{ stinker_models }}"
  when: llm_enabled | default(true) and ansible_nas_hostname == "stinker"

- name: Deploy streamweaver LLMs
  ansible.builtin.command:
    cmd: "docker model run {{ item.image_name }} --backend llama.cpp"
  loop: "{{ streamweaver_models }}"
  when: llm_enabled | default(true) and ansible_nas_hostname == "streamweaver"



