llm_enabled: false
llm_config_directory: "{{ docker_home }}/llm"
open_webui_config_directory: "{{ docker_home }}/open-webui"
open_webui_port: "6969"

stinker_models:
  - name: "Gemma 2B"
    image_name: "gemma2b/gemma2b"
    image_version: "latest"
    container_name: "gemma2b"
    env:
      TZ: "{{ ansible_nas_timezone }}"

streamweaver_models:
  - name: "embeddinggemma-2-GGUF"
    image_name: "unsloth/embeddinggemma-2-GGUF"
    image_version: "Q8_0"
    env:
      TZ: "{{ ansible_nas_timezone }}"

  - name: "hf.co/acon96/Home-FunctionGemma-270m"
    image_name: "hf.co/acon96/Home-FunctionGemma-270m"
    image_version: "Q4_K_M"
    env:
      TZ: "{{ ansible_nas_timezone }}"
