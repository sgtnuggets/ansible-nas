---
homepage_enabled: false
homepage_available_externally: false

# directories
homepage_docker_image: ghcr.io/gethomepage/homepage:latest
homepage_data_directory: "{{ docker_home }}/homepage"

# network
homepage_port: "3232"
homepage_hostname: homepage
homepage_allowed_hosts: "{{ ansible_host }}, {{ homepage_hostname }}.{{ ansible_nas_domain }}, {{ homepage_hostname }}:{{ homepage_port }}, {{ ansible_host }}:{{ homepage_port }}"

# uid / gid
homepage_user_id: "1000"
homepage_group_id: "1000"

# docker
homepage_container_name: homepage
