---
- name: Ensure Jitsi directory structure exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ jitsi_compose_dir }}"
    - "{{ jitsi_config_dir }}"
    - "{{ jitsi_config_dir }}/web"
    - "{{ jitsi_config_dir }}/prosody/config"
    - "{{ jitsi_config_dir }}/prosody/prosody-plugins-custom"
    - "{{ jitsi_config_dir }}/storage/web"
    - "{{ jitsi_config_dir }}/storage/prosody"
    - "{{ jitsi_config_dir }}/storage/transcripts"
    - "{{ jitsi_config_dir }}/tmp/web-load-test"
    - "{{ jitsi_config_dir }}/jicofo"
    - "{{ jitsi_config_dir }}/jvb"
  when: jitsi_enabled | bool

- name: Render Jitsi environment file
  ansible.builtin.template:
    src: jitsi.env.j2
    dest: "{{ jitsi_compose_dir }}/.env"
    mode: "0600"
  when: jitsi_enabled | bool

- name: Render Jitsi docker compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jitsi_compose_dir }}/docker-compose.yml"
    mode: "0644"
  when: jitsi_enabled | bool

- name: Ensure Jitsi stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ jitsi_compose_dir }}"
    state: present
    pull: true
    remove_orphans: true
  when: jitsi_enabled | bool
